name: Dependency audit

# Runs nightly rather than on every pull request.
#
# The audit depends on npm's advisory service, which is a third party we do not
# control. Gating merges on it means an npm outage blocks unrelated work -- which
# is exactly what happened on 2026-09-04, when the service returned 503 for over
# an hour. Nightly keeps the check while removing that coupling: a genuine
# advisory is still surfaced within a day, and it can be run on demand at any time.

on:
  schedule:
    # 05:37 Philippine time, so results are waiting at the start of the day.
    # Deliberately off the hour: scheduled jobs are heavily contended at :00.
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: `npm audit` resolves the tree from package-lock.json, so
      # installing node_modules first is wasted work and one more thing to hang.
      - name: Audit
        id: audit
        run: |
          set -uo pipefail

          attempt=1
          max=5

          while [ "$attempt" -le "$max" ]; do
            echo "::group::npm audit (attempt $attempt of $max)"
            output=$(npm audit --package-lock-only --audit-level=high --omit=dev 2>&1)
            status=$?
            printf '%s\n' "$output"
            echo "::endgroup::"

            # Distinguish "the service could not answer" from "the service said
            # there are advisories". Treating an outage as a pass would make this
            # check worthless precisely when it looks green.
            #
            # If npm produced an actual report, that is a real answer whatever the
            # wording: an advisory whose title happens to read "Service Unavailable"
            # must not be mistaken for npm being unavailable.
            produced_report=false
            if printf '%s' "$output" | grep -qiE 'npm audit report|vulnerabilit'; then
              produced_report=true
            fi

            if [ "$produced_report" = false ] && printf '%s' "$output" | grep -qiE \
                 'audit endpoint returned an error|Service Unavailable|ENETUNREACH|ETIMEDOUT|socket hang up|EAI_AGAIN'; then
              echo "npm's advisory service did not answer on attempt $attempt."
              if [ "$attempt" -eq "$max" ]; then
                echo "::error::npm's advisory service was unavailable after $max attempts. The audit did NOT run — this is not a clean result."
                exit 1
              fi
              sleep $(( attempt * 60 ))
              attempt=$(( attempt + 1 ))
              continue
            fi

            # A real answer. The exit code is now meaningful.
            if [ "$status" -eq 0 ]; then
              echo "No high or critical advisories in runtime dependencies."
              exit 0
            fi

            echo "::error::npm audit reported high or critical advisories in runtime dependencies."
            exit 1
          done

      - name: Raise an issue so a failure is not just a red square in the Actions tab
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          marker='[dependency-audit]'
          body="The scheduled dependency audit failed.

          Run: ${RUN_URL}

          This is either a high or critical advisory in a runtime dependency, or
          npm's advisory service being unavailable after retries. The run log says
          which. An unavailable service is reported as a failure on purpose — a
          security check that could not run must not look like one that passed."

          existing=$(gh issue list --state open --search "\"${marker}\" in:title" \
                       --json number --jq '.[0].number // empty')

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${marker} Nightly dependency audit failed" --body "${body}"
          fi
